services:
  app:
    image: ghcr.io/patrykgielo/registro:latest
    container_name: registro-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app_public:/var/www/public
      - storage-app-public:/var/www/storage/app/public
      - storage-app-private:/var/www/storage/app/private
      - storage-framework:/var/www/storage/framework
      - storage-logs:/var/www/storage/logs
    networks:
      - registro-prod
    healthcheck:
      test: ["CMD-SHELL", "php artisan inspire || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - APP_NAME=${APP_NAME:-Registro}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - SESSION_ENCRYPT=true
      - SESSION_SECURE_COOKIE=true
      - SESSION_SAME_SITE=lax
      - FILESYSTEM_DISK=public
      - LOG_CHANNEL=stack
      - LOG_STACK=daily
      - LOG_DAILY_DAYS=30
      - LOG_LEVEL=error
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - SMSAPI_TOKEN=${SMSAPI_TOKEN}
      - SMSAPI_SERVICE=${SMSAPI_SERVICE:-pl}
      - SMSAPI_WEBHOOK_SECRET=${SMSAPI_WEBHOOK_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_MAPS_MAP_ID=${GOOGLE_MAPS_MAP_ID}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: registro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-registro}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-registro}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - registro-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: registro-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - registro-prod
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.25-alpine
    container_name: registro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/app.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/public:ro
      - storage-app-public:/var/www/storage/app/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    networks:
      - registro-prod
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 10s
      timeout: 3s
      retries: 3

  horizon:
    image: ghcr.io/patrykgielo/registro:latest
    container_name: registro-horizon
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - registro-prod
    environment:
      - APP_NAME=${APP_NAME:-Registro}
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - SESSION_ENCRYPT=true
      - FILESYSTEM_DISK=public
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - SMSAPI_TOKEN=${SMSAPI_TOKEN}
      - SMSAPI_SERVICE=${SMSAPI_SERVICE:-pl}
      - SMSAPI_WEBHOOK_SECRET=${SMSAPI_WEBHOOK_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_MAPS_MAP_ID=${GOOGLE_MAPS_MAP_ID}
    depends_on:
      - app
      - redis
      - mysql
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep running"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  scheduler:
    image: ghcr.io/patrykgielo/registro:latest
    container_name: registro-scheduler
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - registro-prod
    environment:
      - APP_NAME=${APP_NAME:-Registro}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLIENT=phpredis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - SESSION_ENCRYPT=true
      - FILESYSTEM_DISK=public
      - LOG_CHANNEL=stack
      - LOG_STACK=daily
      - LOG_DAILY_DAYS=30
      - LOG_LEVEL=error
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=tls
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - SMSAPI_TOKEN=${SMSAPI_TOKEN}
      - SMSAPI_SERVICE=${SMSAPI_SERVICE:-pl}
      - SMSAPI_WEBHOOK_SECRET=${SMSAPI_WEBHOOK_SECRET}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_MAPS_MAP_ID=${GOOGLE_MAPS_MAP_ID}
    depends_on:
      - app
      - mysql
      - redis
    command: php artisan schedule:work

networks:
  registro-prod:
    driver: bridge

volumes:
  app_public:
  storage-app-public:
  storage-app-private:
  storage-framework:
  storage-logs:
  mysql_data:
  redis_data:
