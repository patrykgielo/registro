services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPCACHE_MODE: dev
    container_name: registro-app
    restart: unless-stopped
    working_dir: /var/www/
    volumes:
      - .:/var/www
      - ./docker/php/opcache-dev.ini:/usr/local/etc/php/conf.d/zzz-opcache-dev.ini
    networks:
      - registro
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: registro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-registro}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-registro}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./docker/mysql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - registro

  nginx:
    image: nginx:1.25-alpine
    container_name: registro-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8444:443"
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - registro
    depends_on:
      - app

  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: registro-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5173:5173"
    networks:
      - registro
    user: "1000:1000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app

  redis:
    image: redis:7.2-alpine
    container_name: registro-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - registro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes

  mailpit:
    image: axllent/mailpit:latest
    container_name: registro-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - registro
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registro-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - registro
    depends_on:
      - app
      - redis
      - mysql
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction
        sleep 60
      done"

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registro-horizon
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - registro
    depends_on:
      - app
      - redis
      - mysql
    command: php artisan horizon

networks:
  registro:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local