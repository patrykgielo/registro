name: Build and Deploy

# Disabled for Registro migration - manual trigger only
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and deploy (vMAJOR.MINOR.PATCH)'
        required: true
        type: string

# Prevent concurrent deployments - queue new ones, don't cancel
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mariadb:
        image: mariadb:10.11
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: registro_test
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a  # v2.33.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, pdo_mysql, mysql, redis, exif, pcntl, gd, zip, intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092  # v3.4.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations and seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run PHPUnit tests
        run: |
          php artisan config:clear
          php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          QUEUE_CONNECTION: redis
          CACHE_DRIVER: redis
          CACHE_STORE: redis
          SESSION_DRIVER: array
          MAIL_MAILER: array

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          # deploy.sh on the server enforces the same shape; failing here means
          # failing before an image is built rather than at the last step.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION does not exist in the repository"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build image
        run: |
          docker build \
            --no-cache \
            --pull \
            --build-arg OPCACHE_MODE=production \
            --tag ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }} \
            --tag ghcr.io/patrykgielo/registro:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/patrykgielo/registro:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    environment:
      name: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (with retry)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 60
          # The whole deploy procedure lives in /opt/registro/deploy.sh on the
          # server (source: scripts/server/deploy.sh), owned by root and pinned
          # as a forced command in the deploy user's authorized_keys. Sending a
          # script over `bash -s` instead would make this key a
          # run-anything-as-deploy key, and deploy is in the docker group.
          command: |
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=60 \
              -o StrictHostKeyChecking=accept-new \
              -o UpdateHostKeys=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "deploy $VERSION"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health Check (Post-Deployment)
        timeout-minutes: 5
        run: |
          echo "Verifying application health..."
          for i in {1..30}; do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ secrets.VPS_HOST }}/up 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1
