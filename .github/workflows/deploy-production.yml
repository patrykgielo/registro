name: Build and Deploy

# Disabled for Registro migration - manual trigger only
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and deploy (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      skip_tests:
        description: 'DANGEROUS: skip the PHPUnit gate and deploy UNVERIFIED code. Requires skip_tests_confirm below to exactly match "version". Only for re-deploying a tag that already passed this exact pipeline.'
        required: false
        type: boolean
        default: false
      skip_tests_confirm:
        description: 'To actually skip tests, retype the exact value of "version" above. Any mismatch fails the run immediately, before anything is built.'
        required: false
        type: string
        default: ''

# Prevent concurrent deployments - queue new ones, don't cancel
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # Single source of truth for "are we skipping tests", so the three jobs
  # below never each re-implement the boolean+confirm comparison and risk
  # drifting apart. Fails the whole run in seconds (before checkout, before
  # any MySQL/Redis service container spins up) if skip_tests=true was set
  # with a confirm value that does NOT match -- silently falling back to
  # "run tests anyway" would be safe, but it would also be invisible: the
  # operator asked to skip, got a slower deploy instead, and nothing told
  # them why. Fail loud instead of fail quiet-but-safe.
  preflight:
    name: Resolve skip_tests
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      skip_tests: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Validate skip_tests confirmation
        id: resolve
        env:
          SKIP_TESTS: ${{ inputs.skip_tests }}
          CONFIRM: ${{ inputs.skip_tests_confirm }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$SKIP_TESTS" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CONFIRM" = "$VERSION" ]; then
            echo "::warning::skip_tests=true -- the PHPUnit gate is being SKIPPED for $VERSION by explicit operator request. This deploy is NOT verified by this pipeline run. Only correct for re-deploying a tag that already passed here once."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::skip_tests=true but skip_tests_confirm ('$CONFIRM') does not match version ('$VERSION'). Refusing to guess: set skip_tests_confirm to exactly '$VERSION' to skip, or leave skip_tests=false to run the tests."
            exit 1
          fi

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.skip_tests != 'true'
    permissions:
      contents: read

    services:
      # mysql:8.0, not mariadb -- must match docker-compose.prod.yml's `mysql`
      # service exactly. Production runs MySQL 8.0.46 (verified from the UAT
      # dump header, "mysqldump 10.13 Distrib 8.0.46"); MariaDB rejects the
      # `->>` JSON operator MySQL 8 accepts, so a MariaDB gate can never pass
      # a migration that is valid on the engine we actually deploy to. See
      # ci-cd-troubleshooting.md, incident dated the day this was fixed.
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: registro_test
        # Command and flags unchanged from the old mariadb block on purpose --
        # verified directly against mysql:8.0 (not assumed): `mysqladmin ping
        # -h127.0.0.1 -psecret --silent` with no explicit -u succeeds the same
        # way it did against mariadb, and a root@% grant exists on mysql:8.0
        # by default (confirmed via `SELECT user,host FROM mysql.user`), so
        # the plain TCP root login below needs no extra flags either.
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # 7.2-alpine, not 7.0 -- must match docker-compose.prod.yml's `redis`
      # service (image: redis:7.2-alpine). Same class of drift as mysql/mariadb
      # above: a gate that never ran on the engine we deploy against.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a  # v2.33.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, pdo_mysql, mysql, redis, exif, pcntl, gd, zip, intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092  # v3.4.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations and seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      # QUEUE_CONNECTION/CACHE_DRIVER/CACHE_STORE are deliberately sync/array here,
      # matching .env.testing exactly -- NOT redis, despite production running
      # redis for both. This block only needs to override what .env.testing can't
      # (DB_*, to point at this job's ephemeral MySQL 8.0 service instead of
      # SQLite). QUEUE_CONNECTION=redis here (inherited unvalidated from this
      # workflow's very first commit, never exercised until this suite's first
      # real MySQL run) silently defers every ShouldQueueAfterCommit notification
      # dispatch -- hundreds of Feature tests are written assuming .env.testing's
      # synchronous pipeline (see e.g. ProcessRentalReturnRemindersJobTest's own
      # docblock) and fail on an unrelated queue driver mismatch, not a real bug.
      # See .claude/rules/tests.md and .claude/rules/ci-cd-troubleshooting.md.
      - name: Run PHPUnit tests
        run: |
          php artisan config:clear
          php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          QUEUE_CONNECTION: sync
          CACHE_DRIVER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array

  build:
    runs-on: ubuntu-latest
    needs: [preflight, test]
    # Default `needs:` semantics only run this job when every job in `needs`
    # succeeded -- a job whose `if:` made it report "skipped" (the normal,
    # deliberate outcome of skip_tests=true) does NOT count as success by
    # default, so without this explicit condition build would silently never
    # run on any skip_tests deploy. `!cancelled()` (not the default
    # `success()`) is required for the `needs.test.result == 'skipped'`
    # branch to even be evaluated -- see GitHub's own docs on skipped jobs.
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          # deploy.sh on the server enforces the same shape; failing here means
          # failing before an image is built rather than at the last step.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION does not exist in the repository"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        # The default "docker" driver buildx ships with on GH-hosted runners
        # cannot export the registry/gha cache backends used below -- only
        # the docker-container driver this action creates can. Required for
        # cache-to/cache-from to do anything at all, not an optimization.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          pull: true
          # No supply-chain need for attestations on an internal deploy
          # pipeline, and provenance/SBOM manifests are additional untagged
          # objects under this same GHCR package -- disabling them keeps the
          # only untagged garbage this job can create to the gha cache's own
          # entries (which live in Actions cache storage, not GHCR, and are
          # evicted by GitHub automatically -- see cache-to below).
          provenance: false
          sbom: false
          build-args: |
            OPCACHE_MODE=production
          tags: |
            ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }}
            ghcr.io/patrykgielo/registro:latest
          # type=gha, not type=registry: this pipeline only ever builds from
          # workflow_dispatch against a git TAG (never a branch push), and
          # GitHub's own cache access rule is "current ref, base ref, default
          # branch" -- unverified here whether a tag ref counts as its own
          # permanently-isolated scope (would make this cache a no-op across
          # releases) or falls back to the default branch. type=registry has
          # no such ambiguity (plain OCI pull, no ref ACL) but pays for it in
          # GHCR storage that needs its own cleanup -- this repo's
          # cleanup-cache.yml already targets a `buildcache-*` registry tag
          # scheme for that reason, but zero such tags have ever existed
          # (verified via `gh api .../packages/container/registro/versions`)
          # because nothing ever wrote one; it predates this change and is
          # unrelated to it, not modified here. type=gha costs nothing to get
          # wrong: worst case is zero cache hit, same 3.3 min as today, no
          # GHCR storage, no separate cleanup workflow to maintain. See
          # ci-cd-troubleshooting.md for what to check after the first two
          # real dispatches.
          cache-from: type=gha,scope=registro-image
          # mode=max caches the frontend-builder stage's layers too (npm ci,
          # npm run build) -- mode=min (the default) only caches the final
          # image's own layers and would never cache a stage that isn't
          # copied whole into it. ignore-error=true: a cache-service hiccup
          # must never fail an actual deploy over a lost optimization.
          cache-to: type=gha,scope=registro-image,mode=max,ignore-error=true

  deploy:
    runs-on: ubuntu-latest
    needs: [preflight, test, build]
    # Same "skipped test job still counts" reasoning as build's `if:` above.
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build.result == 'success'
    # This job never checks out code and never calls the GitHub API -- it only
    # opens an SSH session. An empty scope means a leaked GITHUB_TOKEN from any
    # step here can do nothing to the repository.
    permissions: {}
    environment:
      name: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (with retry)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          # Generous: deploy.sh budgets 120s for MySQL, 60s for Redis, an
          # unbounded migration, eight artisan cache commands and a 180s health
          # check. Exceeding the cap kills the ssh client and orphans the remote
          # script, which is why deploy.sh traps signals and why log() tolerates
          # a closed stdout.
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 60
          # Retry ONLY transport failures. ssh returns 255 for its own errors
          # (connection refused, timeout, host unreachable) and otherwise passes
          # through the remote command's exit code, so this retries a flaky
          # network and nothing else. Retrying deploy.sh's own failures is
          # actively harmful: exit 3 after a failed migration means attempt 2
          # runs against a half-applied schema and fails differently, which is
          # harder to diagnose than the original error, and exit 4 means another
          # deploy holds the lock, so retrying just races it.
          retry_on_exit_code: 255
          # Without this the action defaults to retry_on: any, and the TIMEOUT
          # branch is separate from the exit-code branch -- so a run that
          # overshoots the cap would still be retried, 60s later, while the
          # orphaned remote script still holds the deploy lock. The retry then
          # returns exit 4 and reports "another deploy is already running",
          # disguising a timeout as a concurrency error.
          retry_on: error
          # The whole deploy procedure lives in /opt/registro/deploy.sh on the
          # server (source: scripts/server/deploy.sh), owned by root and pinned
          # as a forced command in the deploy user's authorized_keys. Sending a
          # script over `bash -s` instead would make this key a
          # run-anything-as-deploy key, and deploy is in the docker group.
          command: |
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=60 \
              -o StrictHostKeyChecking=accept-new \
              -o UpdateHostKeys=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "deploy $VERSION"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health Check (Post-Deployment)
        timeout-minutes: 5
        env:
          # secrets.VPS_HOST is the SSH-only hostname (srv1342834.hstgr.cloud) and
          # is deliberately NOT reused here: the TLS certificate only covers the
          # app domain (registrolabs.com and its SANs), so hitting VPS_HOST over
          # HTTPS fails on the TLS handshake before the app is ever asked
          # anything -- a deploy can succeed while this job goes red for a
          # reason that has nothing to do with the deploy.
          #
          # vars.HEALTH_CHECK_HOST must name a host the *current* certificate
          # covers. No fallback to VPS_HOST or to a hardcoded domain on purpose:
          # a fallback that "just works" today is exactly how this broke in the
          # first place (an app-domain migration on 2026-08-08 left this check
          # silently pointed at the wrong host for a week). An unset variable
          # fails the job immediately instead of quietly checking nothing.
          HEALTH_CHECK_HOST: ${{ vars.HEALTH_CHECK_HOST }}
        run: |
          if [ -z "$HEALTH_CHECK_HOST" ]; then
            echo "::error::vars.HEALTH_CHECK_HOST is not set. Set it to the app domain covered by the TLS certificate (currently registrolabs.com) in repo/environment variables -- do NOT reuse secrets.VPS_HOST, it is SSH-only and outside the cert's SAN list."
            exit 1
          fi
          echo "Verifying application health against https://${HEALTH_CHECK_HOST}/up ..."
          for i in {1..30}; do
            CURL_RC=0
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://${HEALTH_CHECK_HOST}/up" 2>/tmp/health_check_err)" || CURL_RC=$?
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            if [ "$CURL_RC" -ne 0 ]; then
              echo "Attempt $i/30: curl failed (exit $CURL_RC): $(tr '\n' ' ' < /tmp/health_check_err)"
            else
              echo "Attempt $i/30: HTTP $HTTP_CODE"
            fi
            sleep 10
          done
          echo "::error::Health check failed after 5 minutes against https://${HEALTH_CHECK_HOST}/up"
          exit 1
