name: Build and Deploy

# Disabled for Registro migration - manual trigger only
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build and deploy (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      skip_tests:
        description: 'DANGEROUS: skip the PHPUnit gate and deploy UNVERIFIED code. Requires skip_tests_confirm below to exactly match "version". A mismatch is safe: the tests just run anyway (see the build job log for a warning either way). Only for re-deploying a tag that already passed this exact pipeline.'
        required: false
        type: boolean
        default: false
      skip_tests_confirm:
        description: 'To actually skip tests, retype the exact value of "version" above. Any mismatch (typo, empty, stale value) is safe: tests run as normal.'
        required: false
        type: string
        default: ''

# Prevent concurrent deployments - queue new ones, don't cancel
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    # Deliberately fail-safe, not fail-loud: skip ONLY when BOTH
    # skip_tests=true AND skip_tests_confirm matches version EXACTLY. Any
    # mismatch (typo, empty, a value left over from a previous dispatch)
    # makes this condition false and the tests just run -- the same, safe
    # default as skip_tests=false. No dedicated job validates this first:
    # running the tests on a mismatch IS the safe fallback, not an error
    # condition to report before the fact -- a prior version of this
    # workflow used a separate `preflight` job for that validation and was
    # corrected (GitHub Actions bills every job a minimum of one full
    # minute regardless of runtime; a ~10s validation job would tax EVERY
    # dispatch, including the overwhelming skip_tests=false majority, to
    # serve the rare skip case -- see ci-cd-troubleshooting.md, 2026-08-16).
    # Visibility on the outcome (skipped, or attempted-but-mismatched) lives
    # in `build`'s "Report skip_tests outcome" step instead, which costs
    # nothing extra: it's a step inside a job that already runs and is
    # already billed for its own ~3 min.
    if: |
      !(inputs.skip_tests == true && inputs.skip_tests_confirm == inputs.version)
    permissions:
      contents: read

    services:
      # mysql:8.0, not mariadb -- must match docker-compose.prod.yml's `mysql`
      # service exactly. Production runs MySQL 8.0.46 (verified from the UAT
      # dump header, "mysqldump 10.13 Distrib 8.0.46"); MariaDB rejects the
      # `->>` JSON operator MySQL 8 accepts, so a MariaDB gate can never pass
      # a migration that is valid on the engine we actually deploy to. See
      # ci-cd-troubleshooting.md, incident dated the day this was fixed.
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: registro_test
        # Command and flags unchanged from the old mariadb block on purpose --
        # verified directly against mysql:8.0 (not assumed): `mysqladmin ping
        # -h127.0.0.1 -psecret --silent` with no explicit -u succeeds the same
        # way it did against mariadb, and a root@% grant exists on mysql:8.0
        # by default (confirmed via `SELECT user,host FROM mysql.user`), so
        # the plain TCP root login below needs no extra flags either.
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # 7.2-alpine, not 7.0 -- must match docker-compose.prod.yml's `redis`
      # service (image: redis:7.2-alpine). Same class of drift as mysql/mariadb
      # above: a gate that never ran on the engine we deploy against.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a  # v2.33.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, pdo_mysql, mysql, redis, exif, pcntl, gd, zip, intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092  # v3.4.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # --locked reads composer.lock directly (Auditor::getPackages() pulls
      # from $composer->getLocker() when --locked is set, never touching
      # installed/vendor state) -- verified by running `composer audit
      # --locked` with zero vendor/ present and getting the identical
      # advisory count as with a full install. This means the result here is
      # independent of whether "Install Composer dependencies" above ever
      # gains a --no-dev flag; it does not have one today, so the run without
      # --locked would currently give the same answer, but --locked removes
      # that coupling instead of relying on it staying true.
      #
      # No --no-dev on the audit itself: require-dev runs the same way in
      # this job as require does, so its advisories are real CI-surface risk
      # too, not noise -- measured delta on this repo (2026-08-16) was 3
      # low-severity symfony/yaml advisories, i.e. cheap to keep visible.
      #
      # Report-only: composer audit exits 1 when it finds advisories, which
      # would otherwise fail this job. `|| true`-equivalent capture below
      # keeps the job green regardless of findings -- see
      # ci-cd-troubleshooting.md (2026-08-16 entry) for the count measured
      # on this repo and the one-line change to make this blocking.
      #
      # Fail-safe, not fail-shrink: an audit that could not run at all
      # (network failure reaching the advisory API, a corrupt lock file) is
      # NOT reported as "no vulnerabilities" -- composer audit prints
      # nothing to stdout in that case (verified: an unauditable project
      # produces an empty stdout and a STATUS_FAILED exit, same exit code as
      # "advisories found"), so the step distinguishes "ran clean" from
      # "could not tell" by checking whether stdout is valid JSON, not by
      # exit code alone.
      - name: Composer security audit
        if: always() && !cancelled()
        run: |
          AUDIT_EXIT=0
          composer audit --locked --format=json --abandoned=report > /tmp/composer-audit.json 2>/tmp/composer-audit.err || AUDIT_EXIT=$?

          if ! jq -e . /tmp/composer-audit.json >/dev/null 2>&1; then
            echo "::warning::composer audit did not complete (exit $AUDIT_EXIT) -- this is NOT the same as a clean report. See the job summary."
            {
              echo "## Composer security audit"
              echo
              echo "**DID NOT COMPLETE** (exit $AUDIT_EXIT). stderr:"
              echo '```'
              cat /tmp/composer-audit.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(jq '[.advisories[][]] | length' /tmp/composer-audit.json)
          PKGS=$(jq '.advisories | length' /tmp/composer-audit.json)
          ABANDONED=$(jq '.abandoned | length' /tmp/composer-audit.json)

          {
            echo "## Composer security audit (\`composer audit --locked\`)"
            echo
            if [ "$TOTAL" -eq 0 ] && [ "$ABANDONED" -eq 0 ]; then
              echo "No known vulnerabilities and no abandoned packages in composer.lock."
            else
              if [ "$TOTAL" -gt 0 ]; then
                echo "**${TOTAL} advisories across ${PKGS} packages** (full composer.lock, including require-dev):"
                echo
                echo "| Severity | Count |"
                echo "|---|---|"
                jq -r '
                  def sevrank: if .=="critical" then 0 elif .=="high" then 1 elif .=="medium" then 2 elif .=="low" then 3 else 4 end;
                  [.advisories[][] | .severity] | group_by(.) | sort_by(.[0]|sevrank) | map("| \(.[0]) | \(length) |") | .[]
                ' /tmp/composer-audit.json
                echo
                echo "<details><summary>Full list (${TOTAL})</summary>"
                echo
                echo "| Package | Severity | CVE | Advisory |"
                echo "|---|---|---|---|"
                jq -r '
                  def sevrank: if .=="critical" then 0 elif .=="high" then 1 elif .=="medium" then 2 elif .=="low" then 3 else 4 end;
                  [.advisories[][]] | sort_by(.severity|sevrank) | .[]
                  | "| \(.packageName) | \(.severity) | \(.cve // "n/a") | [\(.advisoryId)](\(.link)) |"
                ' /tmp/composer-audit.json
                echo
                echo "</details>"
              fi
              if [ "$ABANDONED" -gt 0 ]; then
                echo
                echo "**${ABANDONED} abandoned package(s):**"
                jq -r '.abandoned | to_entries[] | "- `\(.key)`" + (if (.value|type)=="string" then " (replacement: \(.value))" else "" end)' /tmp/composer-audit.json
              fi
            fi
            echo
            echo "Mode: **report only** -- findings above do not fail this job. To make this"
            echo "blocking, see the 2026-08-16 entry in ci-cd-troubleshooting.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations and seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      # QUEUE_CONNECTION/CACHE_DRIVER/CACHE_STORE are deliberately sync/array here,
      # matching .env.testing exactly -- NOT redis, despite production running
      # redis for both. This block only needs to override what .env.testing can't
      # (DB_*, to point at this job's ephemeral MySQL 8.0 service instead of
      # SQLite). QUEUE_CONNECTION=redis here (inherited unvalidated from this
      # workflow's very first commit, never exercised until this suite's first
      # real MySQL run) silently defers every ShouldQueueAfterCommit notification
      # dispatch -- hundreds of Feature tests are written assuming .env.testing's
      # synchronous pipeline (see e.g. ProcessRentalReturnRemindersJobTest's own
      # docblock) and fail on an unrelated queue driver mismatch, not a real bug.
      # See .claude/rules/tests.md and .claude/rules/ci-cd-troubleshooting.md.
      - name: Run PHPUnit tests
        run: |
          php artisan config:clear
          php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          QUEUE_CONNECTION: sync
          CACHE_DRIVER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array

  build:
    runs-on: ubuntu-latest
    needs: test
    # Default `needs:` semantics only run this job when every job in `needs`
    # succeeded -- a job whose `if:` made it report "skipped" (the normal,
    # deliberate outcome of a matched skip_tests) does NOT count as success by
    # default, so without this explicit condition build would silently never
    # run on any skip_tests deploy. `!cancelled()` (not the default
    # `success()`) is required for the `needs.test.result == 'skipped'`
    # branch to even be evaluated -- see GitHub's own docs on skipped jobs.
    if: |
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # workflow_dispatch runs against a branch; the artefact must come
          # from the tag being released, and tags must be present for the
          # existence check in "Resolve version".
          ref: ${{ inputs.version || github.ref }}
          fetch-depth: 0

      # Only place skip_tests is surfaced to the operator (see `test`'s `if:`
      # comment for why there's no dedicated validation job). Silent -- and
      # cheap, just an `if:` check -- for the overwhelming skip_tests=false
      # default. TEST_RESULT is guaranteed 'success' or 'skipped' here: this
      # step only runs when build itself does, and build's own `if:` above
      # already restricts it to exactly those two outcomes.
      - name: Report skip_tests outcome
        if: inputs.skip_tests == true
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.skip_tests_confirm }}
        run: |
          if [ "$TEST_RESULT" = "skipped" ]; then
            echo "::warning::skip_tests=true -- the PHPUnit gate was SKIPPED for $VERSION by explicit operator request (skip_tests_confirm matched). This deploy is NOT verified by this pipeline run."
          else
            echo "::warning::skip_tests=true was requested but skip_tests_confirm ('$CONFIRM') did not match version ('$VERSION') -- the PHPUnit gate ran anyway (fail-safe default, not an error). Re-dispatch with skip_tests_confirm set to exactly '$VERSION' if you actually intended to skip."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}"
          # deploy.sh on the server enforces the same shape; failing here means
          # failing before an image is built rather than at the last step.
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::tag $VERSION does not exist in the repository"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        # The default "docker" driver buildx ships with on GH-hosted runners
        # cannot export the registry/gha cache backends used below -- only
        # the docker-container driver this action creates can. Required for
        # cache-to/cache-from to do anything at all, not an optimization.
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          pull: true
          # No supply-chain need for attestations on an internal deploy
          # pipeline, and provenance/SBOM manifests are additional untagged
          # objects under this same GHCR package -- disabling them keeps the
          # only untagged garbage this job can create to the gha cache's own
          # entries (which live in Actions cache storage, not GHCR, and are
          # evicted by GitHub automatically -- see cache-to below).
          provenance: false
          sbom: false
          build-args: |
            OPCACHE_MODE=production
          tags: |
            ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }}
            ghcr.io/patrykgielo/registro:latest
          # type=gha, not type=registry: this pipeline only ever builds from
          # workflow_dispatch against a git TAG (never a branch push), and
          # GitHub's own cache access rule is "current ref, base ref, default
          # branch" -- unverified here whether a tag ref counts as its own
          # permanently-isolated scope (would make this cache a no-op across
          # releases) or falls back to the default branch. type=registry has
          # no such ambiguity (plain OCI pull, no ref ACL) but pays for it in
          # GHCR storage that needs its own cleanup -- this repo's
          # cleanup-cache.yml already targets a `buildcache-*` registry tag
          # scheme for that reason, but zero such tags have ever existed
          # (verified via `gh api .../packages/container/registro/versions`)
          # because nothing ever wrote one; it predates this change and is
          # unrelated to it, not modified here. type=gha costs nothing to get
          # wrong: worst case is zero cache hit, same 3.3 min as today, no
          # GHCR storage, no separate cleanup workflow to maintain. See
          # ci-cd-troubleshooting.md for what to check after the first two
          # real dispatches.
          cache-from: type=gha,scope=registro-image
          # mode=max caches the frontend-builder stage's layers too (npm ci,
          # npm run build) -- mode=min (the default) only caches the final
          # image's own layers and would never cache a stage that isn't
          # copied whole into it. ignore-error=true: a cache-service hiccup
          # must never fail an actual deploy over a lost optimization.
          cache-to: type=gha,scope=registro-image,mode=max,ignore-error=true

      # OS layer only, not `vuln-type: os,library` (the action's default):
      # application dependencies are already covered by the "Composer
      # security audit" step in the `test` job above, using Packagist's own
      # advisory feed. Verified locally (2026-08-16) that Trivy's own
      # composer-vendor scan of this exact image reports the SAME 10
      # packages as `composer audit --locked --no-dev` -- scanning it again
      # here would only ever duplicate composer audit's finding on the same
      # package, or (if the two advisory databases ever disagree) contradict
      # it, with no way for an operator reading both summaries to know which
      # one is authoritative. npm devDependencies never reach this stage
      # either -- only the compiled public/build assets are copied into the
      # final image (see Dockerfile) -- confirmed by the same local scan:
      # zero javascript/npm findings.
      #
      # `scanners: vuln` drops the action's default `secret` scanner --
      # secret scanning is a different check with a different false-positive
      # profile, out of scope for this change.
      #
      # No account or token needed by default: aquasecurity/setup-trivy
      # installs the trivy CLI on the runner (not a nested container) and
      # pulls the vulnerability DB from a public OCI registry. The action's
      # built-in DB cache (`cache: true`, the default) is kept on because
      # ghcr.io/aquasecurity/trivy-db has a documented history of
      # rate-limiting anonymous pulls under aggregate GitHub Actions load
      # (aquasecurity/trivy-action#389, aquasecurity/trivy discussion #8009)
      # -- caching is the difference between "no DB download most runs" and
      # "compete with every other trivy-action user in the world for the
      # same anonymous quota". Not verified against this exact rate limit
      # from a real dispatch (forbidden here); if a future run fails with
      # TOOMANYREQUESTS, that history is where to start.
      #
      # image-ref pulls the tag this job just pushed, from GHCR, rather than
      # scanning the local daemon's copy -- this job's `docker/build-push-
      # action` call above does not set `load: true`, so there is no local
      # copy to scan without adding a second, redundant export. The GHCR
      # credentials `docker/login-action` established earlier in this job
      # are expected to carry over via Docker's standard credential store,
      # which Trivy's registry client reads by default -- NOT verified end
      # to end (would require an actual dispatch); if this step ever fails
      # to pull, check auth first, before assuming it's a real scan failure.
      - name: Scan image for OS vulnerabilities (Trivy)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }}
          format: json
          output: trivy-results.json
          vuln-type: os
          scanners: vuln
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          # Flip this one value to '1' to fail the pipeline on any finding in
          # the severity list above. Report-only for now -- see
          # ci-cd-troubleshooting.md (2026-08-16 entry) for why: this image's
          # OS layer had 19 CRITICAL findings that day, and EVERY one of them
          # had no upstream fix yet (verified: FixedVersion empty on all 19,
          # 6 distinct CVEs across debian's perl/libxml2/linux-libc-dev
          # packages) -- blocking on raw severity today would deadlock every
          # release rather than catch a real regression. A sane blocking
          # policy needs ignore-unfixed and a triaged severity floor first,
          # not a bare exit-code flip.
          exit-code: '0'

      # Bounded summary, not the full report: the OS layer alone had 2275
      # findings when measured locally (2026-08-16), most without a
      # severity-driving CVSS score from Debian's own tracker (UNKNOWN is
      # its own bucket below, not folded into LOW -- collapsing it would
      # misrepresent how much of this is actually unscored, not
      # low-priority). Dumping all 2275 rows into $GITHUB_STEP_SUMMARY would
      # be unreadable and risks the step summary's 1 MiB cap; the full
      # machine-readable report is uploaded as an artifact instead.
      - name: Summarize Trivy findings
        if: always() && !cancelled() && steps.trivy.outcome != 'skipped'
        run: |
          if [ ! -s trivy-results.json ]; then
            echo "::warning::trivy-results.json is missing or empty -- the scan did not produce a report. Not the same as a clean scan."
            {
              echo "## Image vulnerability scan (Trivy, OS packages)"
              echo
              echo "**DID NOT COMPLETE** -- no report file was produced."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)
          {
            echo "## Image vulnerability scan (Trivy, OS packages only)"
            echo
            echo "Scanned \`ghcr.io/patrykgielo/registro:${{ steps.version.outputs.VERSION }}\`. Application"
            echo "dependencies (composer.lock) are covered separately by the Composer security"
            echo "audit step in the \`test\` job -- not duplicated here."
            echo
            if [ "$TOTAL" -eq 0 ]; then
              echo "No known OS-package vulnerabilities found."
            else
              echo "**${TOTAL} findings** in the base image's OS packages:"
              echo
              echo "| Severity | Count | With a fix available |"
              echo "|---|---|---|"
              jq -r '
                def sevrank: if .=="CRITICAL" then 0 elif .=="HIGH" then 1 elif .=="MEDIUM" then 2 elif .=="LOW" then 3 else 4 end;
                [.Results[]?.Vulnerabilities[]?]
                | group_by(.Severity) | sort_by(.[0]|sevrank)
                | .[]
                | "| \(.[0].Severity) | \(length) | \([.[] | select(.FixedVersion != null and .FixedVersion != "")] | length) |"
              ' trivy-results.json
              CRIT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
              if [ "$CRIT" -gt 0 ]; then
                echo
                echo "<details><summary>CRITICAL findings (${CRIT})</summary>"
                echo
                echo "| Package | Installed | Fixed in | CVE |"
                echo "|---|---|---|---|"
                jq -r '
                  [.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")]
                  | unique_by(.VulnerabilityID + "|" + .PkgName)
                  | .[]
                  | "| \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "no fix yet") | [\(.VulnerabilityID)](\(.PrimaryURL // "")) |"
                ' trivy-results.json
                echo
                echo "</details>"
              fi
              echo
              echo "Full report (all severities, every package): download the \`trivy-results\` artifact from this run."
            fi
            echo
            echo "Mode: **report only** -- findings above do not fail this job. To make this"
            echo "blocking, see the 2026-08-16 entry in ci-cd-troubleshooting.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-results-${{ steps.version.outputs.VERSION }}
          path: trivy-results.json
          retention-days: 30
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    # Same "skipped test job still counts" reasoning as build's `if:` above.
    if: |
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.build.result == 'success'
    # This job never checks out code and never calls the GitHub API -- it only
    # opens an SSH session. An empty scope means a leaked GITHUB_TOKEN from any
    # step here can do nothing to the repository.
    permissions: {}
    environment:
      name: production

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (with retry)
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        env:
          VERSION: ${{ needs.build.outputs.version }}
        with:
          # Generous: deploy.sh budgets 120s for MySQL, 60s for Redis, an
          # unbounded migration, eight artisan cache commands and a 180s health
          # check. Exceeding the cap kills the ssh client and orphans the remote
          # script, which is why deploy.sh traps signals and why log() tolerates
          # a closed stdout.
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 60
          # Retry ONLY transport failures. ssh returns 255 for its own errors
          # (connection refused, timeout, host unreachable) and otherwise passes
          # through the remote command's exit code, so this retries a flaky
          # network and nothing else. Retrying deploy.sh's own failures is
          # actively harmful: exit 3 after a failed migration means attempt 2
          # runs against a half-applied schema and fails differently, which is
          # harder to diagnose than the original error, and exit 4 means another
          # deploy holds the lock, so retrying just races it.
          retry_on_exit_code: 255
          # Without this the action defaults to retry_on: any, and the TIMEOUT
          # branch is separate from the exit-code branch -- so a run that
          # overshoots the cap would still be retried, 60s later, while the
          # orphaned remote script still holds the deploy lock. The retry then
          # returns exit 4 and reports "another deploy is already running",
          # disguising a timeout as a concurrency error.
          retry_on: error
          # The whole deploy procedure lives in /opt/registro/deploy.sh on the
          # server (source: scripts/server/deploy.sh), owned by root and pinned
          # as a forced command in the deploy user's authorized_keys. Sending a
          # script over `bash -s` instead would make this key a
          # run-anything-as-deploy key, and deploy is in the docker group.
          command: |
            ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=60 \
              -o StrictHostKeyChecking=accept-new \
              -o UpdateHostKeys=yes \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "deploy $VERSION"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health Check (Post-Deployment)
        timeout-minutes: 5
        env:
          # secrets.VPS_HOST is the SSH-only hostname (srv1342834.hstgr.cloud) and
          # is deliberately NOT reused here: the TLS certificate only covers the
          # app domain (registrolabs.com and its SANs), so hitting VPS_HOST over
          # HTTPS fails on the TLS handshake before the app is ever asked
          # anything -- a deploy can succeed while this job goes red for a
          # reason that has nothing to do with the deploy.
          #
          # vars.HEALTH_CHECK_HOST must name a host the *current* certificate
          # covers. No fallback to VPS_HOST or to a hardcoded domain on purpose:
          # a fallback that "just works" today is exactly how this broke in the
          # first place (an app-domain migration on 2026-08-08 left this check
          # silently pointed at the wrong host for a week). An unset variable
          # fails the job immediately instead of quietly checking nothing.
          HEALTH_CHECK_HOST: ${{ vars.HEALTH_CHECK_HOST }}
        run: |
          if [ -z "$HEALTH_CHECK_HOST" ]; then
            echo "::error::vars.HEALTH_CHECK_HOST is not set. Set it to the app domain covered by the TLS certificate (currently registrolabs.com) in repo/environment variables -- do NOT reuse secrets.VPS_HOST, it is SSH-only and outside the cert's SAN list."
            exit 1
          fi
          echo "Verifying application health against https://${HEALTH_CHECK_HOST}/up ..."
          for i in {1..30}; do
            CURL_RC=0
            HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://${HEALTH_CHECK_HOST}/up" 2>/tmp/health_check_err)" || CURL_RC=$?
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            if [ "$CURL_RC" -ne 0 ]; then
              echo "Attempt $i/30: curl failed (exit $CURL_RC): $(tr '\n' ' ' < /tmp/health_check_err)"
            else
              echo "Attempt $i/30: HTTP $HTTP_CODE"
            fi
            sleep 10
          done
          echo "::error::Health check failed after 5 minutes against https://${HEALTH_CHECK_HOST}/up"
          exit 1
