name: Run Tests

# Disabled for Registro migration - manual trigger only
on:
  workflow_dispatch:

# Cancel in-progress runs for same branch (faster feedback on new pushes)
concurrency:
  group: tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      # mysql:8.0, not mariadb -- must match docker-compose.prod.yml's `mysql`
      # service exactly. Production runs MySQL 8.0.46 (verified from the UAT
      # dump header, "mysqldump 10.13 Distrib 8.0.46"); MariaDB rejects the
      # `->>` JSON operator MySQL 8 accepts, so a MariaDB gate can never pass
      # a migration that is valid on the engine we actually deploy to. See
      # ci-cd-troubleshooting.md, incident 2026-08-15 (deploy-production.yml).
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: registro_test
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # 7.2-alpine, not 7.0 -- must match docker-compose.prod.yml's `redis`
      # service (image: redis:7.2-alpine). Same class of drift as mysql/mariadb
      # above: a gate that never ran on the engine we deploy against.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a  # v2.33.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, pdo_mysql, mysql, redis, exif, pcntl, gd, zip, intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@f4b3439a656ba812b8cb417d2d49f9c810103092  # v3.4.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # --locked reads composer.lock directly (Auditor::getPackages() pulls
      # from $composer->getLocker() when --locked is set, never touching
      # installed/vendor state) -- verified by running `composer audit
      # --locked` with zero vendor/ present and getting the identical
      # advisory count as with a full install. This means the result here is
      # independent of whether "Install Composer dependencies" above ever
      # gains a --no-dev flag; it does not have one today, so the run without
      # --locked would currently give the same answer, but --locked removes
      # that coupling instead of relying on it staying true.
      #
      # No --no-dev on the audit itself: require-dev runs the same way in
      # this job as require does, so its advisories are real CI-surface risk
      # too, not noise -- measured delta on this repo (2026-08-16) was 3
      # low-severity symfony/yaml advisories, i.e. cheap to keep visible.
      #
      # Report-only: composer audit exits 1 when it finds advisories, which
      # would otherwise fail this job. `|| true`-equivalent capture below
      # keeps the job green regardless of findings -- see
      # ci-cd-troubleshooting.md (2026-08-16 entry) for the count measured
      # on this repo and the one-line change to make this blocking.
      #
      # Fail-safe, not fail-shrink: an audit that could not run at all
      # (network failure reaching the advisory API, a corrupt lock file) is
      # NOT reported as "no vulnerabilities" -- composer audit prints
      # nothing to stdout in that case (verified: an unauditable project
      # produces an empty stdout and a STATUS_FAILED exit, same exit code as
      # "advisories found"), so the step distinguishes "ran clean" from
      # "could not tell" by checking whether stdout is valid JSON, not by
      # exit code alone.
      - name: Composer security audit
        if: always() && !cancelled()
        run: |
          AUDIT_EXIT=0
          composer audit --locked --format=json --abandoned=report > /tmp/composer-audit.json 2>/tmp/composer-audit.err || AUDIT_EXIT=$?

          if ! jq -e . /tmp/composer-audit.json >/dev/null 2>&1; then
            echo "::warning::composer audit did not complete (exit $AUDIT_EXIT) -- this is NOT the same as a clean report. See the job summary."
            {
              echo "## Composer security audit"
              echo
              echo "**DID NOT COMPLETE** (exit $AUDIT_EXIT). stderr:"
              echo '```'
              cat /tmp/composer-audit.err
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(jq '[.advisories[][]] | length' /tmp/composer-audit.json)
          PKGS=$(jq '.advisories | length' /tmp/composer-audit.json)
          ABANDONED=$(jq '.abandoned | length' /tmp/composer-audit.json)

          {
            echo "## Composer security audit (\`composer audit --locked\`)"
            echo
            if [ "$TOTAL" -eq 0 ] && [ "$ABANDONED" -eq 0 ]; then
              echo "No known vulnerabilities and no abandoned packages in composer.lock."
            else
              if [ "$TOTAL" -gt 0 ]; then
                echo "**${TOTAL} advisories across ${PKGS} packages** (full composer.lock, including require-dev):"
                echo
                echo "| Severity | Count |"
                echo "|---|---|"
                jq -r '
                  def sevrank: if .=="critical" then 0 elif .=="high" then 1 elif .=="medium" then 2 elif .=="low" then 3 else 4 end;
                  [.advisories[][] | .severity] | group_by(.) | sort_by(.[0]|sevrank) | map("| \(.[0]) | \(length) |") | .[]
                ' /tmp/composer-audit.json
                echo
                echo "<details><summary>Full list (${TOTAL})</summary>"
                echo
                echo "| Package | Severity | CVE | Advisory |"
                echo "|---|---|---|---|"
                jq -r '
                  def sevrank: if .=="critical" then 0 elif .=="high" then 1 elif .=="medium" then 2 elif .=="low" then 3 else 4 end;
                  [.advisories[][]] | sort_by(.severity|sevrank) | .[]
                  | "| \(.packageName) | \(.severity) | \(.cve // "n/a") | [\(.advisoryId)](\(.link)) |"
                ' /tmp/composer-audit.json
                echo
                echo "</details>"
              fi
              if [ "$ABANDONED" -gt 0 ]; then
                echo
                echo "**${ABANDONED} abandoned package(s):**"
                jq -r '.abandoned | to_entries[] | "- `\(.key)`" + (if (.value|type)=="string" then " (replacement: \(.value))" else "" end)' /tmp/composer-audit.json
              fi
            fi
            echo
            echo "Mode: **report only** -- findings above do not fail this job. To make this"
            echo "blocking, see the 2026-08-16 entry in ci-cd-troubleshooting.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations and seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      # QUEUE_CONNECTION/CACHE_DRIVER/CACHE_STORE are deliberately sync/array here,
      # matching .env.testing exactly -- NOT redis, despite production running
      # redis for both. This block only needs to override what .env.testing can't
      # (DB_*, to point at this job's ephemeral MySQL 8.0 service instead of
      # SQLite). QUEUE_CONNECTION=redis here silently defers every
      # ShouldQueueAfterCommit notification dispatch -- hundreds of Feature tests
      # are written assuming .env.testing's synchronous pipeline and fail on an
      # unrelated queue driver mismatch, not a real bug. Database engine tracks
      # production (correctness of the code under test); queue/cache driver
      # tracks .env.testing (determinism of the test), not production -- see
      # .claude/rules/tests.md and .claude/rules/ci-cd-troubleshooting.md.
      - name: Run PHPUnit tests
        run: |
          php artisan config:clear
          php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          QUEUE_CONNECTION: sync
          CACHE_DRIVER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array
