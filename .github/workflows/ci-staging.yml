name: CI/CD Staging

# Disabled for Registro migration - manual trigger only
on:
  workflow_dispatch:

# Prevent concurrent runs - queue new ones
concurrency:
  group: ci-staging
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # JOB 1: Run Tests
  # ==========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      # mysql:8.0, not mariadb -- must match docker-compose.prod.yml's `mysql`
      # service exactly. Production runs MySQL 8.0.46 (verified from the UAT
      # dump header, "mysqldump 10.13 Distrib 8.0.46"); MariaDB rejects the
      # `->>` JSON operator MySQL 8 accepts, so a MariaDB gate can never pass
      # a migration that is valid on the engine we actually deploy to. See
      # ci-cd-troubleshooting.md, incident 2026-08-15 (deploy-production.yml).
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: registro_test
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -psecret --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # 7.2-alpine, not 7.0 -- must match docker-compose.prod.yml's `redis`
      # service (image: redis:7.2-alpine). Same class of drift as mysql/mariadb
      # above: a gate that never ran on the engine we deploy against.
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766ab3549210a39a2a  # v2.33.0
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, pdo_sqlite, pdo_mysql, mysql, redis, exif, pcntl, gd, zip, intl, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel Pint (Code Style)
        run: ./vendor/bin/pint --test

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      - name: Run migrations and seeders
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret

      # QUEUE_CONNECTION/CACHE_DRIVER/CACHE_STORE are deliberately sync/array here,
      # matching .env.testing exactly -- NOT redis, despite production running
      # redis for both. This block only needs to override what .env.testing can't
      # (DB_*, to point at this job's ephemeral MySQL 8.0 service instead of
      # SQLite). QUEUE_CONNECTION=redis here silently defers every
      # ShouldQueueAfterCommit notification dispatch -- hundreds of Feature tests
      # are written assuming .env.testing's synchronous pipeline and fail on an
      # unrelated queue driver mismatch, not a real bug. Database engine tracks
      # production (correctness of the code under test); queue/cache driver
      # tracks .env.testing (determinism of the test), not production -- see
      # .claude/rules/tests.md and .claude/rules/ci-cd-troubleshooting.md.
      - name: Run PHPUnit tests
        run: |
          php artisan config:clear
          php artisan test --testsuite=Feature
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_test
          DB_USERNAME: root
          DB_PASSWORD: secret
          QUEUE_CONNECTION: sync
          CACHE_DRIVER: array
          CACHE_STORE: array
          SESSION_DRIVER: array
          MAIL_MAILER: array

  # ==========================================================================
  # JOB 2: Build Docker Image
  # ==========================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.commit.outputs.SHORT_SHA }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract commit SHA
        id: commit
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building develop image: $SHORT_SHA"

      - name: Build and push image
        run: |
          docker build \
            --no-cache \
            --pull \
            --build-arg OPCACHE_MODE=production \
            --tag ghcr.io/patrykgielo/registro:develop \
            --tag ghcr.io/patrykgielo/registro:develop-${{ steps.commit.outputs.SHORT_SHA }} \
            .
          docker push ghcr.io/patrykgielo/registro:develop
          docker push ghcr.io/patrykgielo/registro:develop-${{ steps.commit.outputs.SHORT_SHA }}
          echo "Image pushed: ghcr.io/patrykgielo/registro:develop"

  # ==========================================================================
  # JOB 3: Deploy to Staging
  # ==========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Staging VPS
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08  # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ConnectTimeout=60 -o StrictHostKeyChecking=accept-new \
              ${{ secrets.STAGING_VPS_USER }}@${{ secrets.STAGING_VPS_HOST }} 'bash -s' << 'DEPLOY_SCRIPT'
            set -e

            echo "Staging Deployment - $(date '+%Y-%m-%d %H:%M:%S')"
            cd /var/www/registro || exit 1

            # Load .env variables (REDIS_PASSWORD etc.) into shell environment
            set -a
            source .env
            set +a

            # Configs come from the checkout that already exists on the box.
            # raw.githubusercontent does not accept the Actions GITHUB_TOKEN for
            # a private repository, and the curl variant silently overwrote
            # tracked files in a git working tree.
            git fetch --prune origin develop
            git checkout --force origin/develop

            # Login and pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.staging.yml pull

            # Recreate containers
            docker compose -f docker-compose.staging.yml up -d --force-recreate app mysql redis nginx horizon scheduler

            # Wait for services
            echo "Waiting for MySQL..."
            until docker compose -f docker-compose.staging.yml exec -T mysql mysqladmin ping -h localhost --silent < /dev/null; do
              sleep 2
            done

            echo "Waiting for Redis..."
            until docker compose -f docker-compose.staging.yml exec -T redis redis-cli -a "$REDIS_PASSWORD" ping < /dev/null | grep -q PONG 2>/dev/null; do
              sleep 2
            done

            # Run migrations and optimize
            docker compose -f docker-compose.staging.yml exec -T app php artisan migrate --force < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan optimize:clear < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan filament:optimize-clear < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan config:cache < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan route:cache < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan view:cache < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan event:cache < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan filament:optimize < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app composer install --optimize-autoloader --no-dev < /dev/null
            docker compose -f docker-compose.staging.yml exec -T app php artisan storage:link < /dev/null || true
            docker compose -f docker-compose.staging.yml restart horizon

            echo "Deployment complete!"
            docker compose -f docker-compose.staging.yml ps
            DEPLOY_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Health Check
        timeout-minutes: 3
        run: |
          echo "Verifying application health..."
          for i in {1..18}; do
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://${{ secrets.STAGING_VPS_HOST }}/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "Attempt $i/18: HTTP $HTTP_CODE, retrying..."
            sleep 10
          done
          echo "Health check failed"
          exit 1
