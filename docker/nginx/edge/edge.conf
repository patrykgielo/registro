# =============================================================================
# REGISTRO EDGE -- HTTP ONLY (bootstrap)
#
# Task 5 of the stack-per-tenant epic: this is the ONE stack that publishes
# 80/443. Every other stack -- the legacy shared one (docker-compose.prod.yml)
# and every future per-tenant one (task 4) -- keeps those ports unpublished and
# is reached only through here.
#
# This file is the edge's equivalent of docker/nginx/production/app.prod.conf:
# it has NO ssl_certificate directive on purpose, so the edge can start on a
# box that has no certificate yet. Bring-up order:
#   1. Start the edge on THIS config (EDGE_NGINX_CONF unset/default) and verify
#      port 80 answers.
#   2. Once a certificate exists at the path edge-tls.conf expects (today: the
#      same multi-SAN certificate scripts/server/sync-certificate.sh already
#      maintains for the legacy stack -- see app/docs/deployment/edge-stack.md),
#      switch EDGE_NGINX_CONF to edge-tls.local.conf and `up -d edge-nginx`.
#
# Deliberately carries NO `include tenants.d/*.conf;`. Attaching a tenant is
# only ever done against the TLS config (edge-tls.local.conf) -- a tenant vhost
# always declares `listen 443 ssl;`, and loading one here, before any
# certificate exists, would refuse to start the whole edge over one tenant's
# file. See app/docs/deployment/edge-stack.md for the attach procedure.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Same `^~` reasoning as app.prod.conf:50 -- must win over any later regex
    # location before one gets added here, and must keep answering after the
    # switch to TLS so certbot renewals never stop working.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # default_server catch-all -> 444 (close the connection, no response at
    # all), not 404. See edge-tls.conf's fallback server block for the full
    # rationale; it applies here just the same, and this file is what a
    # scanner actually reaches before any certificate has ever been issued.
    location / {
        return 444;
    }
}
