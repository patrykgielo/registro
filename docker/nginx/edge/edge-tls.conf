# =============================================================================
# REGISTRO EDGE -- TLS  (TEMPLATE -- DO NOT MOUNT THIS FILE)
#
# Mirrors docker/nginx/production/app.prod-tls.conf exactly: CERT_DOMAIN below
# is a placeholder, this file is tracked, and it is rendered into the untracked
# edge-tls.local.conf (see .gitignore) with the real certificate directory
# name. Never edit CERT_DOMAIN in place here -- there is no `apply` script yet
# to re-render it after a `git checkout --force` the way deploy.sh does for
# the legacy stack (task 6, out of scope for this PR), so an in-place edit
# would need to survive by hand on the server. Render with:
#
#   sed 's|CERT_DOMAIN|<live-cert-directory-name>|g' \
#       docker/nginx/edge/edge-tls.conf > docker/nginx/edge/edge-tls.local.conf
#
# and set EDGE_NGINX_CONF=edge-tls.local.conf. Full procedure, including which
# directory name to use, in app/docs/deployment/edge-stack.md.
#
# CERTIFICATE SOURCE -- THE SWAPPABLE PART
#
# Today CERT_DOMAIN points at the SAME multi-SAN certificate
# scripts/server/sync-certificate.sh already maintains for the legacy stack --
# one certificate carrying every live tenant subdomain as a SAN, issued via
# HTTP-01 through the .well-known location below. That is deliberate: the task
# this file exists for is the edge itself, not wildcard issuance, which is
# blocked on a nameserver decision that belongs to the domain owner, not this
# codebase (see app/docs/deployment/edge-stack.md, "Why no wildcard yet").
#
# When the two wildcards (*.registrolabs.com, *.registroapps.com) become
# obtainable, ONLY this block changes: two ssl_certificate/ssl_certificate_key
# pairs (one per apex domain) selected by server_name/SNI instead of one
# CERT_DOMAIN shared by every server block, and the per-tenant vhosts in
# tenants.d/ stop needing their own ssl_certificate lines entirely (today they
# repeat CERT_DOMAIN only because nginx requires an ssl_certificate directive
# on every `listen ... ssl` block that doesn't inherit one from a matching
# default_server on the same address -- see tenants.d/_example.conf.disabled).
# Nothing about proxy_pass, the resolver pattern, error_page, or the tenant
# network model changes.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect, minus the ACME challenge path (must keep answering
# over plain HTTP for renewals -- both today's HTTP-01 and, once it exists,
# any future renewal path that still needs a plain-HTTP hop).
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS -- fallback for any Host with no matching tenant vhost
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/CERT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CERT_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # default_server -> 444, not 404. Today's app.prod.conf/app.prod-tls.conf
    # are deliberate catch-alls (`server_name _`) because ResolveTenant does
    # the narrowing later, inside the app, from the Host header -- any Host
    # reaching them is meant to fall through to PHP and either resolve a
    # tenant or hit the app's own "no such tenant" page. Copying that 1:1 here
    # would be wrong in the opposite direction: the edge's whole job IS the
    # narrowing (only per-tenant vhosts below have a real upstream to reach),
    # so an unmatched Host has nowhere correct to go. 444 is nginx's own
    # non-standard code that closes the connection without sending a status
    # line at all -- unlike 404, which is a real, cacheable, crawlable
    # response that confirms a working server is willing to discuss hostnames
    # it doesn't recognise. Scanners and Certificate Transparency watchers use
    # exactly that distinction to fingerprint ingress; 444 gives them nothing.
    location / {
        return 444;
    }
}

# ---------------------------------------------------------------------------
# Per-tenant vhosts. One file per attached tenant in tenants.d/, named after
# the slug, added/removed by hand today (task 6's `apply` script is a later
# concern) per app/docs/deployment/edge-stack.md. Template + full commentary
# on the proxy_pass/resolver/error_page pattern: tenants.d/_example.conf.disabled.
# ---------------------------------------------------------------------------
include /etc/nginx/tenants.d/*.conf;
