# =============================================================================
# REGISTRO PRODUCTION NGINX -- HTTP ONLY
#
# This is the config the stack starts with. It has NO ssl_certificate
# directives, which is deliberate: nginx refuses to start if a referenced
# certificate file is missing, so a TLS-first config makes the very first
# bring-up impossible on a machine that has no certificate yet.
#
# Order of operations (see the bootstrap plan, phases 4-5):
#   1. Bring the stack up on this config, over plain HTTP, and verify /up.
#   2. Obtain a certificate with certbot --dry-run, then for real. The
#      /.well-known/acme-challenge/ location below serves the webroot challenge.
#   3. Switch to TLS by setting NGINX_CONF=app.prod-tls.conf in .env and
#      running `docker compose -f docker-compose.prod.yml up -d nginx`.
#      Rolling back is the same edit in reverse.
#
# server_name is a catch-all on purpose. Registro resolves the tenant from the
# Host header (ResolveTenant), so every tenant subdomain must reach the app;
# pinning a single hostname here would 301 them into oblivion. It also means
# this file contains no hostname to go stale -- the previous version still
# named the predecessor project's host and the local dev domain.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # Resolve the app container by name on every request rather than caching its
    # IP at startup -- required for zero-downtime container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_app app:9000;

    # Let's Encrypt webroot challenge. Must stay reachable over plain HTTP even
    # after TLS is enabled, which is why the TLS variant keeps this block too.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # No Strict-Transport-Security and no upgrade-insecure-requests here: both
    # are meaningless (and actively harmful) before TLS exists. They live in the
    # TLS variant.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://cdn.jsdelivr.net https://cdn-cookieyes.com https://*.cookieyes.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com https://*.googleusercontent.com https://ui-avatars.com https://www.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://cdn-cookieyes.com https://*.cookieyes.com; frame-src 'self' https://*.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
