# =============================================================================
# REGISTRO PRODUCTION NGINX CONFIGURATION
# Domain: registro.local (primary)
# Old domain: srv1117368.hstgr.cloud (redirect to primary)
# =============================================================================

# HTTP -> HTTPS redirect (ALL domains)
server {
    listen 80;
    server_name srv1117368.hstgr.cloud www.srv1117368.hstgr.cloud registro.local www.registro.local;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other traffic to HTTPS primary domain
    location / {
        return 301 https://registro.local$request_uri;
    }
}

# =============================================================================
# HTTPS - Old domain REDIRECT (security: single entry point)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name srv1117368.hstgr.cloud www.srv1117368.hstgr.cloud;

    # SSL certificates (old domain)
    ssl_certificate /etc/letsencrypt/live/srv1117368.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1117368.hstgr.cloud/privkey.pem;

    # Minimal SSL config for redirect
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # 301 Redirect to primary domain (SECURITY: prevents cross-domain attacks)
    return 301 https://registro.local$request_uri;
}

# =============================================================================
# HTTPS - www.registro.local REDIRECT
# =============================================================================
server {
    listen 443 ssl http2;
    server_name www.registro.local;

    # SSL certificates (new domain)
    ssl_certificate /etc/letsencrypt/live/registro.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registro.local/privkey.pem;

    # Minimal SSL config for redirect
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    # 301 Redirect to primary domain (canonical URL)
    return 301 https://registro.local$request_uri;
}

# =============================================================================
# HTTPS - PRIMARY DOMAIN (registro.local)
# =============================================================================
server {
    listen 443 ssl http2;
    server_name registro.local;
    root /var/www/public;
    index index.php index.html;

    # Dynamic upstream resolution for zero-downtime deployments
    # Prevents Nginx from caching app container IP at startup
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_app app:9000;

    # SSL certificates (new domain)
    ssl_certificate /etc/letsencrypt/live/registro.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registro.local/privkey.pem;

    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # worker-src blob: required for Filament file upload preview (uses Web Workers)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://cdn.jsdelivr.net https://cdn-cookieyes.com https://*.cookieyes.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com https://*.googleusercontent.com https://ui-avatars.com https://www.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://cdn-cookieyes.com https://*.cookieyes.com; frame-src 'self' https://*.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload limits
    client_max_body_size 25M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Static files and Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM only for .php files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
