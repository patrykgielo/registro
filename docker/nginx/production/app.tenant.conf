# =============================================================================
# REGISTRO TENANT NGINX -- plain HTTP, behind the edge only
#
# Task 4 of the stack-per-tenant epic (docker-compose.prod.yml rebuilt into a
# per-tenant stack template). Mounted via NGINX_CONF -- same mechanism
# app.prod.conf/app.prod-tls.conf already use -- once a stack is a genuine
# per-tenant deployment sitting behind docker-compose.edge.yml
# (app/docs/deployment/edge-stack.md). The legacy shared stack never uses this
# file; it keeps app.prod.conf/app.prod-tls.conf exactly as before.
#
# The edge is the ONLY TLS terminator in that architecture (edge-stack.md).
# This file therefore has no ssl_certificate and never will, and no
# /.well-known/acme-challenge/ location -- the edge answers ACME itself, this
# nginx is never reachable from the internet directly (see the compose file's
# HTTP_PORT_V4/V6 note on why a tenant .env must bind those to loopback).
#
# TENANT_SLUG_PLACEHOLDER is rendered to this stack's own TENANT_SLUG via sed
# into app.tenant.local.conf, gitignored -- same pattern as CERT_DOMAIN in
# app.prod-tls.conf (see scripts/deploy-init.sh's wire_up_tls()), for the same
# reason: nginx has no built-in way to read an arbitrary OS environment
# variable at request time, and this repo's own convention is to render once
# at bring-up rather than reach for nginx's separate envsubst-templates
# mechanism. There is no automated renderer for this file yet -- see
# app/docs/deployment/tenant-compose-stack.md for the manual step until task 6
# automates tenant provisioning end to end.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    # Resolve the app container by name on every request rather than caching
    # its IP at startup -- required for zero-downtime container replacement.
    # Same pattern as app.prod.conf:34-35.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_app app:9000;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # No Strict-Transport-Security here: this hop is deliberately plain HTTP,
    # and HSTS on the internal hop would be meaningless -- the edge already
    # sends it to the browser for the real (external, HTTPS) connection.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://cdn.jsdelivr.net https://cdn-cookieyes.com https://*.cookieyes.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com https://*.googleusercontent.com https://ui-avatars.com https://www.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://cdn-cookieyes.com https://*.cookieyes.com; frame-src 'self' https://*.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # THE authoritative tenant identity, set from THIS container's own
        # rendered value -- never from anything already on the request. The
        # edge actively clears any client-supplied X-Tenant before proxying
        # here (docker/nginx/edge/tenants.d/_example.conf.disabled); this is
        # the one and only place it is set for real. HTTP_-prefixed so it
        # lands in PHP exactly where a normal "X-Tenant" HTTP header would
        # ($_SERVER['HTTP_X_TENANT'] / Request::header('X-Tenant')), even
        # though this hop is FastCGI, not a second HTTP proxy. Not consumed by
        # any application code yet -- see tenant-compose-stack.md.
        fastcgi_param HTTP_X_TENANT "TENANT_SLUG_PLACEHOLDER";
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
