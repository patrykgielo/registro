# =============================================================================
# REGISTRO PRODUCTION NGINX -- TLS
#
# NOT the default. Activate only after a certificate exists, by setting
# NGINX_CONF=app.prod-tls.conf in the server's .env and running:
#   docker compose -f docker-compose.prod.yml up -d nginx
# Rolling back to plain HTTP is the same edit with app.prod.conf.
#
# nginx will refuse to start if the certificate paths below do not exist, so
# never switch to this file before `certbot certonly` has succeeded for real
# (a --dry-run does not write certificates).
#
# CERT_DOMAIN below must match the directory certbot created under
# /etc/letsencrypt/live/. It is the ONE hostname in this file; everything else
# is host-agnostic, because Registro serves tenants on subdomains and the
# server blocks are catch-alls.
#
# Tenant subdomains need coverage too. A single-name certificate secures only
# the bare host; serving tenants over HTTPS needs a wildcard certificate, which
# Let's Encrypt only issues via the DNS-01 challenge. Until that exists, tenant
# subdomains will present a name-mismatch warning -- decide this before
# onboarding the first customer, not after.
# =============================================================================

# ---------------------------------------------------------------------------
# HTTP -> HTTPS redirect, minus the ACME challenge path, which must keep
# answering over plain HTTP for renewals to work.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Health check stays on HTTP: deploy.sh and the CI health check both probe
    # http://127.0.0.1/up from inside the machine, where a 301 would look like
    # a failure and would loop until the deploy times out.
    # /up is a Laravel route, not a file, so it goes straight to PHP-FPM. An
    # exact-match location cannot contain a nested regex location, hence the
    # explicit fastcgi block rather than try_files.
    location = /up {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_app app:9000;

        include fastcgi_params;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS -- application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream_app app:9000;

    # Replace CERT_DOMAIN with the certbot live directory name. deploy-init.sh
    # rewrites this placeholder; if you install the certificate by hand, sed it
    # yourself before switching NGINX_CONF over.
    ssl_certificate     /etc/letsencrypt/live/CERT_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CERT_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.bunny.net https://cdn.jsdelivr.net https://cdn-cookieyes.com https://*.cookieyes.com; img-src 'self' data: blob: https://maps.gstatic.com https://maps.googleapis.com https://*.ggpht.com https://*.googleusercontent.com https://ui-avatars.com https://www.googletagmanager.com https://cdn-cookieyes.com https://*.cookieyes.com; font-src 'self' data: https://fonts.gstatic.com https://fonts.bunny.net; connect-src 'self' https://maps.googleapis.com https://*.googleapis.com https://cdn.jsdelivr.net https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://cdn-cookieyes.com https://*.cookieyes.com; frame-src 'self' https://*.google.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
